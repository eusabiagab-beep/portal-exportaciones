      </form>
    </div>`;

  const empresas = await listarEmpresas();
  const selectEmpresa = document.getElementById('filtro-empresa');
  selectEmpresa.innerHTML = empresas.map((e) => `<option value="${e.id}">${escapeHTML(e.razon_social)}</option>`).join('');
  const empresaPreseleccionada = getRutaQuery().get('empresa');
  if (empresaPreseleccionada) selectEmpresa.value = empresaPreseleccionada;

  const hilo = document.getElementById('hilo-comentarios');
  let cancelarSuscripcion = null;
  function pintarComentario(c) {
    const item = document.createElement('div');
    item.className = 'flex gap-3';
    item.innerHTML = `<div class="sello-exportacion" style="width:32px;height:32px;font-size:11px;flex-shrink:0;">${iniciales(c.usuarios?.nombre_completo)}</div>
      <div class="flex-col gap-1"><div class="flex items-center gap-2"><span class="font-medium text-sm">${escapeHTML(c.usuarios?.nombre_completo || 'Usuario')}</span><span class="text-xs text-tertiary">${formatearFechaHora(c.creado_en)}</span></div><p class="text-sm">${escapeHTML(c.contenido)}</p></div>`;
    hilo.appendChild(item); hilo.scrollTop = hilo.scrollHeight;
  }
  async function recargar() {
    const empresaId = selectEmpresa.value;
    if (!empresaId) return;
    cancelarSuscripcion?.();
    hilo.innerHTML = '';
    const comentarios = await listarComentarios({ empresaId });
    if (!comentarios.length) hilo.innerHTML = '<div class="empty-state"><p>Aún no hay comentarios para esta empresa.</p></div>';
    else comentarios.forEach(pintarComentario);
    cancelarSuscripcion = suscribirseAComentarios(empresaId, async () => { const actualizados = await listarComentarios({ empresaId }); hilo.innerHTML = ''; actualizados.forEach(pintarComentario); });
  }
  selectEmpresa.addEventListener('change', recargar);
  if (empresas.length) await recargar();

  document.getElementById('form-comentario').addEventListener('submit', async (e) => {
    e.preventDefault();
    const input = document.getElementById('input-comentario');
    const texto = input.value.trim();
    if (!texto) return;
    const empresaId = selectEmpresa.value;
    if (!empresaId) return toast.error('Selecciona una empresa.');
    try { await crearComentario({ empresaId, contenido: texto }); input.value = ''; } catch (err) { toast.error(err.message); }
  });
}

async function vistaProveedorDocumentos() {

        <div class="field"><label class="field__label">Tipo de documento</label>
          <select class="select" id="input-tipo">
            <option value="CATALOGO_PDF">Catálogo PDF</option><option value="LISTA_PRECIOS">Lista de precios</option><option value="FICHA_TECNICA">Ficha técnica</option>
            <option value="ESPECIFICACIONES">Especificaciones</option><option value="ETIQUETAS">Etiquetas</option><option value="FOTOGRAFIA">Fotografía</option><option value="VIDEO">Video</option><option value="OTRO">Otro</option>
          </select></div>
        <div class="field hidden" id="campo-otro-tipo"><label class="field__label">Especifica qué tipo de documento es *</label><input class="input" id="input-otro-tipo" placeholder="Ej. Permiso estatal" /></div>
        <div id="dropzone-root"></div>
      </div></div>
    <div class="card"><div class="card__body" id="tabla-documentos"></div></div>`;

  const TIPOS_NO_CERTIFICACION = ['CATALOGO_PDF', 'LISTA_PRECIOS', 'FICHA_TECNICA', 'ESPECIFICACIONES', 'ETIQUETAS', 'FOTOGRAFIA', 'VIDEO', 'OTRO'];
  const empresaId = getEmpresaActualId();
  const contenedor = document.getElementById('tabla-documentos');
  const tabla = crearTabla({
    contenedor,
    columnas: [
      { clave: 'nombre_archivo', titulo: 'Archivo', render: (f) => `<button class="btn btn--ghost btn--sm" data-ver="${f.id}" style="padding:0; height:auto; font-weight:500;">${escapeHTML(f.nombre_archivo)}</button>` },
      { clave: 'tipo', titulo: 'Tipo', render: (f) => escapeHTML(formatearTipoDocumento(f)) },
      { clave: 'tamano_bytes', titulo: 'Tamaño', render: (f) => formatearTamanoArchivo(f.tamano_bytes) },
      { clave: 'creado_en', titulo: 'Subido', render: (f) => formatearFecha(f.creado_en) },
      { clave: 'acciones', titulo: '', render: (f) => `<button class="btn btn--sm btn--secondary" data-versiones="${f.id}">Versiones</button>` },
    ], porPagina: 10, textoVacio: 'Aún no has subido documentos.',
  });

  let documentos = [];
  async function recargar() {
    if (!empresaId) return;
    const todos = await listarDocumentosEmpresa(empresaId);
    documentos = todos.filter((d) => TIPOS_NO_CERTIFICACION.includes(d.tipo));
    tabla.setDatos(documentos);
    contenedor.querySelectorAll('[data-ver]').forEach((btn) => btn.addEventListener('click', () => { const doc = documentos.find((d) => d.id === btn.dataset.ver); abrirVistaPrevia({ bucketId: BUCKETS.DOCUMENTOS, ruta: doc.ruta_storage, nombreArchivo: doc.nombre_archivo, mimeType: doc.mime_type }); }));
    contenedor.querySelectorAll('[data-versiones]').forEach((btn) => btn.addEventListener('click', () => { const doc = documentos.find((d) => d.id === btn.dataset.versiones); abrirModalVersiones(doc, empresaId, recargar); }));
  }
  await recargar();
  wireSelectOtro('input-tipo', 'campo-otro-tipo', 'input-otro-tipo');

  crearDropzone({
    contenedor: document.getElementById('dropzone-root'), bucketId: BUCKETS.DOCUMENTOS, multiple: true, accept: '.pdf,.jpg,.jpeg,.png,.webp,.mp4,.mov,.doc,.docx,.xls,.xlsx',
    onArchivosValidos: async (archivos) => {
      if (!empresaId) return toast.error('No tienes una empresa asignada.');
      const tipo = document.getElementById('input-tipo').value;
      const otroDescripcion = document.getElementById('input-otro-tipo').value.trim();
      if (tipo === 'OTRO' && !otroDescripcion) return toast.error('Especifica qué tipo de documento es.');
      for (const archivo of archivos) { try { await subirDocumento({ empresaId, archivo, tipo, otroDescripcion }); } catch (err) { toast.error(`${archivo.name}: ${err.message}`); } }
      toast.exito('Documento(s) subido(s) correctamente.'); await recargar();
    },
  });
}

  }
  await recargar();

  function abrirModalProducto(productoExistente = null) {
    const cuerpoHTML = `
      <form id="form-producto" class="flex-col gap-4">
        <div class="grid gap-3" style="grid-template-columns: 2fr 1fr;">
          <div class="field"><label class="field__label">Nombre *</label><input class="input" name="nombre" value="${escapeHTML(productoExistente?.nombre || '')}" required /></div>

        </div>
        <div class="grid gap-3" style="grid-template-columns: 1fr 1fr;">
          <div class="field"><label class="field__label">Precio</label><input class="input" type="number" step="0.01" name="precio" value="${productoExistente?.precio ?? ''}" /></div>

        </div>
      </form>`;
    const acciones = [
      { texto: 'Cancelar', variante: 'secondary', onClick: (cerrar) => cerrar() },

      titulo: pendiente.titulo, cuerpoHTML, anchoMax: '560px',
      acciones: [
        { texto: 'Cerrar', variante: 'secondary', onClick: (cerrar) => cerrar() },
        { texto: 'Guardar cambios', variante: 'primary', onClick: async (cerrar) => {
          const descripcion = document.getElementById('edit-descripcion').value.trim();
          const prioridad = document.getElementById('edit-prioridad').value;
          const estado = document.getElementById('edit-estado').value;
          try {
            await actualizarPendiente(pendiente.id, empresaId, { descripcion, prioridad, estado, porcentaje: estado === 'completado' ? 100 : pendiente.porcentaje });
            toast.exito('Pendiente actualizado.'); cerrar(); await recargar();
          } catch (err) { toast.error(err.message); }
        } },
      ],
    });

    function pintarArchivos(lista) {
      const cont = document.getElementById('lista-archivos-pendiente');
      cont.innerHTML = lista.length ? lista.map((a) => `<button class="btn btn--secondary btn--sm" data-ver-archivo="${a.id}" style="justify-content:flex-start;">${escapeHTML(a.nombre_archivo)} · ${formatearFechaHora(a.creado_en)}</button>`).join('') : '<span class="text-xs text-tertiary">Sin archivos aún.</span>';
      cont.querySelectorAll('[data-ver-archivo]').forEach((btn) => btn.addEventListener('click', () => { const archivo = lista.find((a) => a.id === btn.dataset.verArchivo); abrirVistaPrevia({ bucketId: BUCKETS.PENDIENTES, ruta: archivo.ruta_storage, nombreArchivo: archivo.nombre_archivo, mimeType: archivo.mime_type }); }));
    }
    pintarArchivos(archivos);

    crearDropzone({
      contenedor: document.getElementById('dropzone-pendiente'), bucketId: BUCKETS.PENDIENTES, multiple: true,
      onArchivosValidos: async (nuevosArchivos) => {
        for (const archivo of nuevosArchivos) { try { await subirArchivoPendiente(pendiente.id, empresaId, archivo); } catch (err) { toast.error(`${archivo.name}: ${err.message}`); } }
        toast.exito('Archivo(s) subido(s).'); pintarArchivos(await listarArchivosPendiente(pendiente.id));
      },
    });
  }
}

async function vistaProveedorComentarios() {
  const contenido = await renderShell('/proveedor/comentarios');
  contenido.innerHTML = `
    <div class="page-header"><div><div class="page-header__eyebrow">Mi empresa</div><h1>Comentarios</h1></div></div>
    <div class="card"><div class="card__body flex-col gap-4" id="hilo-comentarios" style="max-height: 520px; overflow-y:auto;"></div>
      <form id="form-comentario" class="flex gap-3" style="padding: var(--space-4) var(--space-6); border-top: 1px solid var(--color-border);">
        <input class="input" id="input-comentario" placeholder="Escribe un comentario…" style="flex:1;" /><button type="submit" class="btn btn--primary">Enviar</button>
      </form></div>`;

  const empresaId = getEmpresaActualId();
  const hilo = document.getElementById('hilo-comentarios');
  function pintarComentario(c) {
    const item = document.createElement('div');
    item.className = 'flex gap-3';
    item.innerHTML = `<div class="sello-exportacion" style="width:32px;height:32px;font-size:11px;flex-shrink:0;">${iniciales(c.usuarios?.nombre_completo)}</div>
      <div class="flex-col gap-1"><div class="flex items-center gap-2"><span class="font-medium text-sm">${escapeHTML(c.usuarios?.nombre_completo || 'Usuario')}</span><span class="text-xs text-tertiary">${formatearFechaHora(c.creado_en)}</span></div><p class="text-sm">${escapeHTML(c.contenido)}</p></div>`;
    hilo.appendChild(item); hilo.scrollTop = hilo.scrollHeight;
  }
  async function cargarInicial() {
    if (!empresaId) return;
    const comentarios = await listarComentarios({ empresaId });
    hilo.innerHTML = comentarios.length ? '' : '<div class="empty-state"><p>Aún no hay comentarios. Escribe el primero.</p></div>';
    comentarios.forEach(pintarComentario);
    suscribirseAComentarios(empresaId, async () => { const actualizados = await listarComentarios({ empresaId }); hilo.innerHTML = ''; actualizados.forEach(pintarComentario); });
  }
  await cargarInicial();

  document.getElementById('form-comentario').addEventListener('submit', async (e) => {
    e.preventDefault();
    const input = document.getElementById('input-comentario');
    const texto = input.value.trim();
    if (!texto) return;
    if (!empresaId) return toast.error('No tienes una empresa asignada.');
    try { await crearComentario({ empresaId, contenido: texto }); input.value = ''; } catch (err) { toast.error(err.message); }
  });
}

async function vistaProveedorHistorial() {
  const contenido = await renderShell('/proveedor/historial');
  contenido.innerHTML = `<div class="page-header"><div><div class="page-header__eyebrow">Mi empresa</div><h1>Historial de actividad</h1></div></div><div class="card"><div class="card__body" id="tabla-historial"></div></div>`;

  const empresaId = getEmpresaActualId();
  const tabla = crearTabla({
    contenedor: document.getElementById('tabla-historial'),
    columnas: [
      { clave: 'creado_en', titulo: 'Fecha', render: (f) => formatearFechaHora(f.creado_en) },
      { clave: 'usuario', titulo: 'Usuario', render: (f) => escapeHTML(f.usuarios?.nombre_completo || 'Sistema') },
      { clave: 'accion', titulo: 'Acción', render: (f) => escapeHTML(formatearEtiqueta(f.accion)) },
    ], porPagina: 15, textoVacio: 'Sin actividad registrada todavía.',
  });
  if (empresaId) tabla.setDatos(await listarHistorial({ empresaId, limite: 200 }));
}

// --------------------------------------------------------------
// ROUTER — hash routing, protección por rol, mapa de rutas
// --------------------------------------------------------------
const RUTAS = {
  '/login': { vista: vistaLogin, publica: true },
  '/recuperar': { vista: vistaRecuperar, publica: true },
  '/actualizar-password': { vista: vistaActualizarPassword, publica: true },
  '/registro': { vista: vistaRegistro, roles: ['admin'] },
  '/admin/dashboard': { vista: vistaAdminDashboard, roles: ['admin', 'admin_lectura'] },
  '/admin/empresas': { vista: vistaAdminEmpresas, roles: ['admin', 'admin_lectura'] },
  '/admin/usuarios': { vista: vistaAdminUsuarios, roles: ['admin', 'admin_lectura'] },
  '/admin/pendientes': { vista: vistaAdminPendientes, roles: ['admin', 'admin_lectura'] },
  '/admin/documentos': { vista: vistaAdminDocumentos, roles: ['admin', 'admin_lectura'] },
  '/admin/productos': { vista: vistaAdminProductos, roles: ['admin', 'admin_lectura'] },
  '/admin/comentarios': { vista: vistaAdminComentarios, roles: ['admin', 'admin_lectura'] },
  '/admin/historial': { vista: vistaAdminHistorial, roles: ['admin', 'admin_lectura'] },
  '/admin/configuracion': { vista: vistaAdminConfiguracion, roles: ['admin'] },
  '/proveedor/dashboard': { vista: vistaProveedorDashboard, roles: ['proveedor'] },
  '/proveedor/perfil': { vista: vistaProveedorPerfil, roles: ['proveedor'], pasaUsuario: true },
  '/proveedor/documentos': { vista: vistaProveedorDocumentos, roles: ['proveedor'] },
  '/proveedor/certificaciones': { vista: vistaProveedorCertificaciones, roles: ['proveedor'] },
  '/proveedor/productos': { vista: vistaProveedorProductos, roles: ['proveedor'] },
  '/proveedor/pendientes': { vista: vistaProveedorPendientes, roles: ['proveedor'] },
  '/proveedor/comentarios': { vista: vistaProveedorComentarios, roles: ['proveedor'] },
  '/proveedor/historial': { vista: vistaProveedorHistorial, roles: ['proveedor'] },
};

function rutaHomePorRol(rol) { return rol === 'proveedor' ? '/proveedor/dashboard' : '/admin/dashboard'; }

let rutaQueryActual = new URLSearchParams();
/** @returns {URLSearchParams} query params de la ruta actual (ej. ?empresa=ID) */
function getRutaQuery() { return rutaQueryActual; }

async function router() {
  const hashCompleto = (location.hash || '#/login').slice(1) || '/login';
  const [ruta, queryString] = hashCompleto.split('?');
  rutaQueryActual = new URLSearchParams(queryString || '');
  const definicion = RUTAS[ruta];

  if (!definicion) { location.hash = '#/login'; return; }

  if (definicion.publica) {
    // Si ya hay sesión activa y el usuario visita una ruta pública, redirige a su home.
    if (getUsuarioActual() && ruta === '/login') { location.hash = `#${rutaHomePorRol(getRolActual())}`; return; }
    await definicion.vista();
    return;
  }

  // Rutas protegidas: exigen sesión activa
  const usuario = getUsuarioActual() || await inicializarSesion();
  if (!usuario) { location.hash = '#/login'; return; }

  if (definicion.roles && !definicion.roles.includes(getRolActual())) {
    location.hash = `#${rutaHomePorRol(getRolActual())}`;
    return;
  }

  document.body.classList.remove('cargando-sesion');
  await definicion.vista(definicion.pasaUsuario ? usuario : undefined);
}

// --------------------------------------------------------------
// INICIALIZACIÓN
// --------------------------------------------------------------
await inicializarSesion();
aplicarTema('light');
window.addEventListener('hashchange', router);
await router();
</script>
