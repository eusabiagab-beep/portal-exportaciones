<style>
/* ============================================================
   DESIGN SYSTEM — Portal de Gestión de Exportaciones
   Dirección: enterprise SaaS de nivel Stripe/Linear/Vercel.
   Deep blue + slate, off-white/near-black, Inter en todo el
   sistema de tipografía, radios 12–18px, sombras muy suaves,
   glassmorphism en superficies flotantes (topbar, dropdowns, modal).
   ============================================================ */

:root {
  /* ---- Color: superficies y texto (claro) -------------------- */
  --color-bg: #F7F8FA;
  --color-bg-subtle: #F0F2F5;
  --color-surface: #FFFFFF;
  --color-surface-raised: #FFFFFF;
  --color-overlay: rgba(15, 23, 42, 0.44);

  --color-border: #E7E9EE;
  --color-border-strong: #D6DAE2;
  --color-border-focus: #2A4A73;

  --color-text-primary: #10151F;
  --color-text-secondary: #5B6472;
  --color-text-tertiary: #97A0AD;
  --color-text-inverse: #FFFFFF;
  --color-text-disabled: #C3C8D1;

  /* ---- Color: marca (Deep Blue + Slate) ----------------------- */
  --color-primary: #2A4A73;
  --color-primary-hover: #21395C;
  --color-primary-active: #182B47;
  --color-primary-subtle: #EAF0F8;
  --color-primary-subtle-text: #2A4A73;

  --color-secondary: #64748B;
  --color-secondary-subtle: #F1F3F6;

  --color-accent: #B8862E;
  --color-accent-hover: #A3782A;
  --color-accent-subtle: #FBF3E3;

  /* ---- Color: semántico (muted, sin saturación excesiva) ------ */
  --color-success: #0F9D6D;
  --color-success-subtle: #E7F7F0;
  --color-warning: #B4780C;
  --color-warning-subtle: #FCF3E1;
  --color-danger: #C6382E;
  --color-danger-subtle: #FBEBEA;
  --color-info: #2563C7;
  --color-info-subtle: #EAF1FC;

  /* ---- Semáforo de cumplimiento (estado de negocio) ------------ */
  --color-semaforo-verde: #0F9D6D;
  --color-semaforo-verde-bg: #E7F7F0;
  --color-semaforo-amarillo: #B4780C;
  --color-semaforo-amarillo-bg: #FCF3E1;
  --color-semaforo-rojo: #C6382E;
  --color-semaforo-rojo-bg: #FBEBEA;
  --color-semaforo-gris: #97A0AD;
  --color-semaforo-gris-bg: #F0F2F5;

  /* ---- Tipografía: Inter en todo el sistema --------------------- */
  --font-display: 'Inter Tight', 'Inter', 'SF Pro Display', system-ui, sans-serif;
  --font-body: 'Inter', 'SF Pro Display', system-ui, -apple-system, sans-serif;
  --font-mono: ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, monospace;

  --text-xs: 0.75rem;
  --text-sm: 0.8125rem;
  --text-base: 0.9375rem;
  --text-md: 1.0625rem;
  --text-lg: 1.375rem;
  --text-xl: 1.875rem;
  --text-2xl: 2.625rem;

  --font-weight-regular: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;
  --font-weight-black: 800;

  --line-height-tight: 1.18;
  --line-height-normal: 1.5;
  --line-height-relaxed: 1.7;

  --letter-spacing-tight: -0.025em;
  --letter-spacing-normal: 0;
  --letter-spacing-wide: 0.05em;

  /* ---- Espaciado (base 4px) ------------------------------------ */
  --space-1: 0.25rem; --space-2: 0.5rem; --space-3: 0.75rem; --space-4: 1rem;
  --space-5: 1.25rem; --space-6: 1.5rem; --space-8: 2rem; --space-10: 2.5rem;
  --space-12: 3rem; --space-16: 4rem; --space-20: 5rem;

  /* ---- Radios: 12–18px como pide el brief ----------------------- */
  --radius-sm: 12px;
  --radius-md: 14px;
  --radius-lg: 18px;
  --radius-full: 999px;

  /* ---- Sombras: muy suaves, nunca duras -------------------------- */
  --shadow-xs: 0 1px 2px rgba(16, 21, 31, 0.03);
  --shadow-sm: 0 2px 6px rgba(16, 21, 31, 0.045), 0 1px 2px rgba(16, 21, 31, 0.03);
  --shadow-md: 0 8px 24px rgba(16, 21, 31, 0.07);
  --shadow-lg: 0 20px 48px rgba(16, 21, 31, 0.10);
  --shadow-focus-ring: 0 0 0 3px rgba(42, 74, 115, 0.16);

  /* ---- Glassmorphism (superficies flotantes) --------------------- */
  --glass-bg: rgba(255, 255, 255, 0.72);
  --glass-border: rgba(255, 255, 255, 0.5);
  --glass-blur: 16px;

  /* ---- Layout ----------------------------------------------------- */
  --sidebar-width: 268px;
  --sidebar-width-collapsed: 76px;
  --topbar-height: 68px;
  --content-max-width: 1400px;
  --container-padding: var(--space-8);

  /* ---- Movimiento --------------------------------------------------- */
  --ease-standard: cubic-bezier(0.4, 0, 0.2, 1);
  --ease-emphasized: cubic-bezier(0.16, 1, 0.3, 1);
  --duration-fast: 120ms;
  --duration-base: 220ms;
  --duration-slow: 420ms;

  /* ---- Z-index ------------------------------------------------------- */
  --z-dropdown: 100; --z-sticky: 200; --z-sidebar: 300;
  --z-modal-overlay: 400; --z-modal: 410; --z-toast: 500; --z-tooltip: 600;
}

@media (prefers-reduced-motion: reduce) {
  :root { --duration-fast: 0ms; --duration-base: 0ms; --duration-slow: 0ms; }
}

/* ============================================================
   BASE — reset, tipografía, layout primitivo
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

body {
  font-family: var(--font-body);
  font-size: var(--text-base);
  line-height: var(--line-height-normal);
  color: var(--color-text-primary);
  background: var(--color-bg);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  font-feature-settings: 'cv11', 'ss01';
}

h1, h2, h3, h4 {
  font-family: var(--font-display);
  font-weight: var(--font-weight-bold);
  letter-spacing: var(--letter-spacing-tight);
  line-height: var(--line-height-tight);
  color: var(--color-text-primary);
}
h1 { font-size: var(--text-2xl); font-weight: var(--font-weight-black); }
h2 { font-size: var(--text-xl); }
h3 { font-size: var(--text-lg); }
h4 { font-size: var(--text-md); font-weight: var(--font-weight-semibold); }
p { color: var(--color-text-secondary); }
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: none; }
ul, ol { list-style: none; }
img, svg { display: block; max-width: 100%; }
code, .mono { font-family: var(--font-mono); font-size: 0.9em; }

:focus-visible { outline: none; box-shadow: var(--shadow-focus-ring); border-radius: var(--radius-sm); }

.app-shell {
  display: grid;
  grid-template-columns: var(--sidebar-width) 1fr;
  min-height: 100vh;
  transition: grid-template-columns var(--duration-base) var(--ease-emphasized);
}
.app-shell[data-sidebar-collapsed="true"] { grid-template-columns: var(--sidebar-width-collapsed) 1fr; }
.app-main { display: flex; flex-direction: column; min-width: 0; }
.app-content { flex: 1; padding: var(--space-8) var(--space-10); max-width: var(--content-max-width); width: 100%; animation: view-in var(--duration-slow) var(--ease-emphasized); }
@keyframes view-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

.breadcrumb { display: flex; align-items: center; gap: var(--space-2); font-size: var(--text-xs); color: var(--color-text-tertiary); font-weight: var(--font-weight-medium); margin-bottom: var(--space-3); }
.breadcrumb__sep { opacity: 0.5; }
.breadcrumb__current { color: var(--color-text-secondary); }

.page-header { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-4); margin-bottom: var(--space-8); flex-wrap: wrap; }
.page-header__eyebrow { font-size: var(--text-xs); font-weight: var(--font-weight-semibold); text-transform: uppercase; letter-spacing: var(--letter-spacing-wide); color: var(--color-primary); margin-bottom: var(--space-1); }
.page-header__actions { display: flex; gap: var(--space-3); align-items: center; }

@media (max-width: 900px) {
  .app-shell { grid-template-columns: 1fr; }
  .app-content { padding: var(--space-4); }
}

.flex { display: flex; } .flex-col { display: flex; flex-direction: column; }
.items-center { align-items: center; } .items-start { align-items: flex-start; }
.justify-between { justify-content: space-between; }
.gap-1 { gap: var(--space-1); } .gap-2 { gap: var(--space-2); } .gap-3 { gap: var(--space-3); }
.gap-4 { gap: var(--space-4); } .gap-6 { gap: var(--space-6); }
.grid { display: grid; }
.text-secondary { color: var(--color-text-secondary); } .text-tertiary { color: var(--color-text-tertiary); }
.text-xs { font-size: var(--text-xs); } .text-sm { font-size: var(--text-sm); }
.font-medium { font-weight: var(--font-weight-medium); } .font-semibold { font-weight: var(--font-weight-semibold); }
.hidden { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
.w-full { width: 100%; } .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--color-border-strong); border-radius: var(--radius-full); border: 2px solid var(--color-bg); }

/* ============================================================
   COMPONENTES
   ============================================================ */

/* ---- Botones ---- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); height: 40px; padding: 0 var(--space-4); font-size: var(--text-sm); font-weight: var(--font-weight-semibold); border-radius: var(--radius-sm); border: 1px solid transparent; transition: all var(--duration-fast) var(--ease-standard); white-space: nowrap; }
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; pointer-events: none; }
.btn--primary { background: var(--color-primary); color: var(--color-text-inverse); box-shadow: var(--shadow-xs); }
.btn--primary:hover { background: var(--color-primary-hover); box-shadow: var(--shadow-sm); transform: translateY(-1px); }
.btn--secondary { background: var(--color-surface); color: var(--color-text-primary); border-color: var(--color-border-strong); }
.btn--secondary:hover { background: var(--color-bg-subtle); border-color: var(--color-text-tertiary); }
.btn--ghost { background: transparent; color: var(--color-text-secondary); }
.btn--ghost:hover { background: var(--color-bg-subtle); color: var(--color-text-primary); }
.btn--danger { background: var(--color-danger); color: var(--color-text-inverse); }
.btn--danger:hover { filter: brightness(0.94); }
.btn--sm { height: 34px; padding: 0 var(--space-3); font-size: var(--text-xs); }
.btn--icon { width: 38px; height: 38px; padding: 0; border-radius: var(--radius-sm); }

/* ---- Formularios ---- */
.field { display: flex; flex-direction: column; gap: var(--space-2); }
.field__label { font-size: var(--text-sm); font-weight: var(--font-weight-semibold); color: var(--color-text-primary); }
.field__hint { font-size: var(--text-xs); color: var(--color-text-tertiary); }
.field__error { font-size: var(--text-xs); color: var(--color-danger); }
.input, .select, .textarea { width: 100%; height: 42px; padding: 0 var(--space-4); background: var(--color-surface); border: 1.5px solid var(--color-border); border-radius: var(--radius-sm); font-size: var(--text-sm); color: var(--color-text-primary); transition: border-color var(--duration-fast) var(--ease-standard), box-shadow var(--duration-fast) var(--ease-standard); }
.textarea { height: auto; min-height: 100px; padding: var(--space-3) var(--space-4); resize: vertical; }
.input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--color-primary); box-shadow: var(--shadow-focus-ring); }
.input--invalid { border-color: var(--color-danger); }
.input::placeholder, .textarea::placeholder { color: var(--color-text-tertiary); }

/* ---- Cards ---- */
.card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); box-shadow: var(--shadow-xs); transition: box-shadow var(--duration-base) var(--ease-standard), border-color var(--duration-base) var(--ease-standard); }
.card__header { padding: var(--space-5) var(--space-6); border-bottom: 1px solid var(--color-border); display: flex; justify-content: space-between; align-items: center; }
.card__body { padding: var(--space-6); }
.card--interactive:hover { box-shadow: var(--shadow-md); border-color: var(--color-border-strong); transform: translateY(-2px); }

/* ---- KPI card premium (con soporte de progress ring / sparkline) ---- */
.kpi-card { padding: var(--space-6); display: flex; flex-direction: column; gap: var(--space-3); position: relative; overflow: hidden; }
.kpi-card::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--color-primary), var(--color-accent)); opacity: 0; transition: opacity var(--duration-base) var(--ease-standard); }
.kpi-card:hover::before { opacity: 1; }
.kpi-card__label { font-size: var(--text-xs); font-weight: var(--font-weight-semibold); color: var(--color-text-tertiary); text-transform: uppercase; letter-spacing: var(--letter-spacing-wide); }
.kpi-card__value { font-family: var(--font-display); font-size: var(--text-2xl); font-weight: var(--font-weight-black); letter-spacing: var(--letter-spacing-tight); }
.kpi-card__delta { font-size: var(--text-xs); font-weight: var(--font-weight-semibold); display: inline-flex; align-items: center; gap: var(--space-1); width: fit-content; padding: var(--space-1) var(--space-2); border-radius: var(--radius-full); }
.kpi-card__delta--up { color: var(--color-success); background: var(--color-success-subtle); }
.kpi-card__delta--down { color: var(--color-danger); background: var(--color-danger-subtle); }
.kpi-card__row { display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); }

/* ---- Progress ring (SVG) ---- */
.progress-ring { display: flex; align-items: center; justify-content: center; position: relative; flex-shrink: 0; }
.progress-ring svg { transform: rotate(-90deg); }
.progress-ring circle { fill: none; stroke-linecap: round; }
.progress-ring__track { stroke: var(--color-bg-subtle); }
.progress-ring__value { stroke: var(--color-primary); transition: stroke-dashoffset var(--duration-slow) var(--ease-emphasized); }
.progress-ring__label { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-weight: var(--font-weight-black); font-size: var(--text-md); }

/* ---- Chip de estado / status pill ---- */
.status-chip { display: inline-flex; align-items: center; gap: var(--space-2); height: 30px; padding: 0 var(--space-3); border-radius: var(--radius-full); font-size: var(--text-xs); font-weight: var(--font-weight-semibold); }
.status-chip__dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; box-shadow: 0 0 0 3px currentColor; opacity: 0.9; }
.status-chip--listo { background: var(--color-success-subtle); color: var(--color-success); }
.status-chip--proceso { background: var(--color-warning-subtle); color: var(--color-warning); }
.status-chip--casi { background: var(--color-info-subtle); color: var(--color-info); }
.status-chip--bloqueado { background: var(--color-danger-subtle); color: var(--color-danger); }

/* ---- Badges / semáforo ---- */
.badge { display: inline-flex; align-items: center; gap: var(--space-1); height: 26px; padding: 0 var(--space-3); font-size: var(--text-xs); font-weight: var(--font-weight-semibold); border-radius: var(--radius-full); }
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.badge--verde { background: var(--color-semaforo-verde-bg); color: var(--color-semaforo-verde); }
.badge--amarillo { background: var(--color-semaforo-amarillo-bg); color: var(--color-semaforo-amarillo); }
.badge--rojo { background: var(--color-semaforo-rojo-bg); color: var(--color-semaforo-rojo); }
.badge--gris { background: var(--color-semaforo-gris-bg); color: var(--color-semaforo-gris); }
.badge--neutral { background: var(--color-bg-subtle); color: var(--color-text-secondary); }
.badge--info { background: var(--color-info-subtle); color: var(--color-info); }

/* ---- Sello de exportación (firma visual) ---- */
.sello-exportacion { width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid var(--color-accent); outline: 1px dashed var(--color-accent); outline-offset: 3px; display: flex; align-items: center; justify-content: center; color: var(--color-accent); font-family: var(--font-display); font-weight: var(--font-weight-bold); font-size: var(--text-xs); flex-shrink: 0; }
.auth-shell__brand h1, .auth-shell__brand h2 { color: var(--color-text-inverse); }

<body class="cargando-sesion">
<div id="app"></div>
<script type="module">
/* ============================================================
   ARCHIVO ÚNICO — JS consolidado (sin import/export entre módulos,
   todo en un solo scope de módulo). Orden: supabase-client, auth,
   session, utils, componentes, services, router, vistas.
   ============================================================ */
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

// --------------------------------------------------------------
// CORE: supabase-client
// --------------------------------------------------------------
const SUPABASE_URL = 'https://uoykwxaxtpdcnstyjrzx.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_RQZnudpZeo8JVal-P8NOQg_MCf5rT8v';

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, storageKey: 'ept-auth' },
  realtime: { params: { eventsPerSecond: 5 } },
});

const BUCKETS = Object.freeze({
  DOCUMENTOS: 'documentos-empresas',
  PRODUCTOS: 'productos-imagenes',
  PENDIENTES: 'pendientes-archivos',
  COMENTARIOS: 'comentarios-adjuntos',
  LOGOS: 'logos-empresas',
  AVATARES: 'avatares',
});

const MENSAJES_ERROR_AMIGABLES = {
  '23505': 'Ya existe un registro con esos datos (duplicado).',
  '23503': 'No se puede completar: hay información relacionada que lo impide.',
  '42501': 'No tienes permisos para realizar esta acción.',
  '22P02': 'Uno de los campos numéricos tiene un valor inválido. Revisa peso, precio y vida útil.',
  PGRST301: 'Tu sesión expiró. Inicia sesión de nuevo.',
};

function mensajeErrorSupabase(error) {
  if (!error) return 'Ocurrió un error inesperado.';
  const codigo = error.code || error.status;
  if (codigo && MENSAJES_ERROR_AMIGABLES[codigo]) return MENSAJES_ERROR_AMIGABLES[codigo];
  console.error('[supabase] Error no mapeado:', error);
  return 'Ocurrió un error al procesar tu solicitud. Intenta de nuevo.';
}

// --------------------------------------------------------------
// CORE: auth
// --------------------------------------------------------------
async function iniciarSesion(email, password) {
  const { data, error } = await supabase.auth.signInWithPassword({ email: email.trim().toLowerCase(), password });
  if (error) {
    if (error.message?.includes('Invalid login')) return { ok: false, error: 'Correo o contraseña incorrectos.' };
    return { ok: false, error: mensajeErrorSupabase(error) };
  }
  const perfil = await obtenerPerfilActual();
  if (!perfil) { await supabase.auth.signOut(); return { ok: false, error: 'Tu cuenta no está habilitada. Contacta al administrador.' }; }
  if (!perfil.activo) { await supabase.auth.signOut(); return { ok: false, error: 'Tu cuenta está desactivada. Contacta al administrador.' }; }
  await registrarUltimoAcceso(data.user.id);
  return { ok: true, usuario: perfil };
}

async function cerrarSesion() {
  await supabase.auth.signOut();
  usuarioActual = null;
  location.hash = '#/login';
}

async function crearUsuario(datos) {
  const perfilAdmin = await obtenerPerfilActual();
  if (!perfilAdmin || perfilAdmin.rol !== 'admin') return { ok: false, error: 'Solo un administrador puede crear usuarios.' };

  const { data: sesion } = await supabase.auth.getSession();
  const { data, error } = await supabase.functions.invoke('crear-usuario', {
    body: {
      email: datos.email.trim().toLowerCase(),
      password: datos.password,
      nombreCompleto: datos.nombre_completo,
      rol: datos.rol,
      empresaId: datos.empresa_id || null,
    },
    headers: { Authorization: `Bearer ${sesion.session.access_token}` },
  });

  if (error || !data?.ok) return { ok: false, error: data?.error || 'La función crear-usuario no respondió lo esperado. Revisa que el código desplegado en Supabase sea el correcto (no el de ejemplo).' };
  return { ok: true };
}

async function solicitarRecuperacion(email) {
  const { error } = await supabase.auth.resetPasswordForEmail(email.trim().toLowerCase(), { redirectTo: `${window.location.origin}${window.location.pathname}#/actualizar-password` });
  if (error) return { ok: false, error: mensajeErrorSupabase(error) };
  return { ok: true };
}

async function actualizarPassword(nuevaPassword) {
  const { error } = await supabase.auth.updateUser({ password: nuevaPassword });
  if (error) return { ok: false, error: mensajeErrorSupabase(error) };
  return { ok: true };
}

async function obtenerPerfilActual() {
  const { data: authData } = await supabase.auth.getUser();
  if (!authData?.user) return null;
  const { data: usuario, error } = await supabase.from('usuarios').select('id, nombre_completo, email, rol, activo, avatar_url, telefono').eq('id', authData.user.id).single();
  if (error || !usuario) return null;
  if (usuario.rol === 'proveedor') {
    const { data: asignacion } = await supabase.from('usuarios_empresas').select('empresa_id, empresas(id, razon_social, nombre_comercial, logo_url)').eq('usuario_id', usuario.id).maybeSingle();
    usuario.empresa = asignacion?.empresas ?? null;
  }
  return usuario;
}

async function registrarUltimoAcceso(usuarioId) {
  await supabase.from('usuarios').update({ ultimo_acceso: new Date().toISOString() }).eq('id', usuarioId);
  await supabase.from('historial_actividad').insert({ usuario_id: usuarioId, accion: 'login', entidad_tipo: 'usuario', entidad_id: usuarioId }).select().maybeSingle();
}

// --------------------------------------------------------------
// CORE: session (estado en memoria del módulo)
// --------------------------------------------------------------
let usuarioActual = null;

let escuchandoCambiosAuth = false;

async function inicializarSesion() {
  usuarioActual = await obtenerPerfilActual();
  if (!escuchandoCambiosAuth) {
    escuchandoCambiosAuth = true;
    supabase.auth.onAuthStateChange(async (evento) => {
      if (evento === 'SIGNED_OUT') { usuarioActual = null; }
      if (evento === 'TOKEN_REFRESHED' || evento === 'USER_UPDATED') { usuarioActual = await obtenerPerfilActual(); }
    });
  }
  return usuarioActual;
}

function getUsuarioActual() { return usuarioActual; }
function getRolActual() { return usuarioActual?.rol ?? null; }
function esStaff() { return getRolActual() === 'admin' || getRolActual() === 'admin_lectura'; }
function esAdmin() { return getRolActual() === 'admin'; }
function getEmpresaActualId() { return usuarioActual?.empresa?.id ?? null; }

function aplicarTema(tema) { document.documentElement.setAttribute('data-theme', tema === 'dark' ? 'dark' : 'light'); }
function alternarTema() { const actual = document.documentElement.getAttribute('data-theme'); aplicarTema(actual === 'dark' ? 'light' : 'dark'); }

// --------------------------------------------------------------
// UTILS: validators
// --------------------------------------------------------------
function esEmailValido(valor) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(valor || '').trim()); }
function esRFCValido(valor) { const rfc = String(valor || '').trim().toUpperCase(); return /^([A-ZÑ&]{3,4})(\d{6})([A-Z\d]{3})$/.test(rfc); }
function esTelefonoValido(valor) { const limpio = String(valor || '').replace(/[\s\-()]/g, ''); return /^\+?\d{10,13}$/.test(limpio); }
function esRequerido(valor) { if (valor === null || valor === undefined) return false; if (typeof valor === 'string') return valor.trim().length > 0; return true; }
function estaEnRango(valor, min, max) { const n = Number(valor); if (Number.isNaN(n)) return false; return n >= min && n <= max; }
function longitudMaxima(valor, max) { return String(valor || '').length <= max; }

// --------------------------------------------------------------
// UTILS: sanitize
// --------------------------------------------------------------
const MAPA_ESCAPE = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;', '/': '&#x2F;' };
function escapeHTML(texto) { return String(texto ?? '').replace(/[&<>"'/]/g, (c) => MAPA_ESCAPE[c]); }

function sanitizarNombreArchivo(nombre) {
  const base = String(nombre || 'archivo').normalize('NFKD').replace(/[\u0300-\u036f]/g, '')
    .split(/[/\\]/).pop().replace(/[^a-zA-Z0-9._-]/g, '_').replace(/_{2,}/g, '_');
  return base.slice(-180);
}
function construirRutaStorage(carpetaId, nombreOriginal) {
  const nombreLimpio = sanitizarNombreArchivo(nombreOriginal);
  const sufijo = crypto.randomUUID().slice(0, 8);
  return `${carpetaId}/${sufijo}-${nombreLimpio}`;
}
function normalizarTexto(texto) { return String(texto || '').trim().replace(/\s+/g, ' '); }

/** Convierte a null los campos numéricos que llegaron como "" desde un <input type="number"> vacío — Postgres rechaza "" en columnas numeric/integer. */
function normalizarCamposNumericos(datos, campos) {
  const copia = { ...datos };
  campos.forEach((c) => { if (copia[c] === '') copia[c] = null; });
  return copia;
}

// --------------------------------------------------------------
// UTILS: formatters
// --------------------------------------------------------------
const LOCALE = 'es-MX';
function formatearFecha(valor, opciones = {}) {
  if (!valor) return '—';
  const fecha = new Date(valor);
  if (Number.isNaN(fecha.getTime())) return '—';
  return new Intl.DateTimeFormat(LOCALE, { day: '2-digit', month: 'short', year: 'numeric', ...opciones }).format(fecha);
}
function formatearFechaHora(valor) {
  if (!valor) return '—';
  const fecha = new Date(valor);
  if (Number.isNaN(fecha.getTime())) return '—';
  return new Intl.DateTimeFormat(LOCALE, { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }).format(fecha);
}
function tiempoRelativo(valor) {
  if (!valor) return '—';
  const diffMs = Date.now() - new Date(valor).getTime();
  const diffMin = Math.round(diffMs / 60000);
  if (diffMin < 1) return 'justo ahora';
  if (diffMin < 60) return `hace ${diffMin} min`;
  const diffH = Math.round(diffMin / 60);
  if (diffH < 24) return `hace ${diffH} h`;
  const diffD = Math.round(diffH / 24);
  if (diffD < 30) return `hace ${diffD} d`;
  return formatearFecha(valor);
}
function formatearMoneda(valor, moneda = 'USD') {
  const n = Number(valor);
  if (Number.isNaN(n)) return '—';
  return new Intl.NumberFormat(LOCALE, { style: 'currency', currency: moneda }).format(n);
}
function formatearNumero(valor, decimales = 0) {
  const n = Number(valor);
  if (Number.isNaN(n)) return '—';
  return new Intl.NumberFormat(LOCALE, { minimumFractionDigits: decimales, maximumFractionDigits: decimales }).format(n);
}
function formatearPorcentaje(valor, decimales = 0) { const n = Number(valor); if (Number.isNaN(n)) return '—'; return `${formatearNumero(n, decimales)}%`; }
function formatearTamanoArchivo(bytes) {
  const n = Number(bytes);
  if (!n || Number.isNaN(n)) return '0 B';
  const unidades = ['B', 'KB', 'MB', 'GB'];
  const i = Math.min(Math.floor(Math.log(n) / Math.log(1024)), unidades.length - 1);
  return `${(n / 1024 ** i).toFixed(i === 0 ? 0 : 1)} ${unidades[i]}`;
}
function formatearEtiqueta(valor) { if (!valor) return '—'; const texto = String(valor).replace(/_/g, ' '); return texto.charAt(0).toUpperCase() + texto.slice(1); }
function formatearTipoDocumento(doc) { return doc.tipo === 'OTRO' && doc.tipo_otro_descripcion ? doc.tipo_otro_descripcion : formatearEtiqueta(doc.tipo); }
function iniciales(nombreCompleto) { if (!nombreCompleto) return '?'; return nombreCompleto.trim().split(/\s+/).slice(0, 2).map((p) => p[0]?.toUpperCase()).join(''); }

const REGLAS_POR_BUCKET = {
  [BUCKETS.DOCUMENTOS]: { tamanoMaxBytes: 26214400, mimePermitidos: ['application/pdf', 'image/jpeg', 'image/png', 'image/webp', 'video/mp4', 'video/quicktime', 'application/msword', 'application/vnd.openxmlformats-officedocument.wordprocessingml.document', 'application/vnd.ms-excel', 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'] },
  [BUCKETS.PRODUCTOS]: { tamanoMaxBytes: 8388608, mimePermitidos: ['image/jpeg', 'image/png', 'image/webp'] },
  [BUCKETS.PENDIENTES]: { tamanoMaxBytes: 15728640, mimePermitidos: ['application/pdf', 'image/jpeg', 'image/png', 'image/webp'] },
  [BUCKETS.COMENTARIOS]: { tamanoMaxBytes: 10485760, mimePermitidos: ['application/pdf', 'image/jpeg', 'image/png', 'image/webp'] },
  [BUCKETS.LOGOS]: { tamanoMaxBytes: 2097152, mimePermitidos: ['image/jpeg', 'image/png', 'image/webp', 'image/svg+xml'] },
  [BUCKETS.AVATARES]: { tamanoMaxBytes: 2097152, mimePermitidos: ['image/jpeg', 'image/png', 'image/webp'] },
};
function validarArchivo(archivo, bucketId) {
  const reglas = REGLAS_POR_BUCKET[bucketId];
  if (!reglas) return { valido: false, error: 'Bucket no reconocido.' };
  if (!archivo) return { valido: false, error: 'No se seleccionó ningún archivo.' };
  if (archivo.size > reglas.tamanoMaxBytes) { const maxMB = (reglas.tamanoMaxBytes / 1048576).toFixed(0); return { valido: false, error: `El archivo supera el límite de ${maxMB} MB.` }; }
  if (!reglas.mimePermitidos.includes(archivo.type)) return { valido: false, error: 'Tipo de archivo no permitido para esta sección.' };
  return { valido: true };
}
async function validarFirmaArchivo(archivo) {
  const firmas = { 'application/pdf': [0x25, 0x50, 0x44, 0x46], 'image/jpeg': [0xff, 0xd8, 0xff], 'image/png': [0x89, 0x50, 0x4e, 0x47] };
  const firma = firmas[archivo.type];
  if (!firma) return true;
  const buffer = await archivo.slice(0, firma.length).arrayBuffer();
  const bytes = new Uint8Array(buffer);
  return firma.every((byte, i) => bytes[i] === byte);
}
async function validarArchivoCompleto(archivo, bucketId) {
  const basico = validarArchivo(archivo, bucketId);
  if (!basico.valido) return basico;
  const firmaOk = await validarFirmaArchivo(archivo);
  if (!firmaOk) return { valido: false, error: 'El contenido del archivo no coincide con su tipo declarado.' };
  return { valido: true };
}

function obtenerStackToast() {
  let stack = document.querySelector('.toast-stack');
  if (!stack) {
    stack = document.createElement('div');
    stack.className = 'toast-stack';
    stack.setAttribute('role', 'status');
    stack.setAttribute('aria-live', 'polite');
    document.body.appendChild(stack);
  }
  return stack;
}
function mostrarToast(mensaje, tipo = 'default', duracionMs = 4000) {
  const stack = obtenerStackToast();
  const el = document.createElement('div');
  el.className = `toast ${tipo !== 'default' ? `toast--${tipo}` : ''}`;
  el.innerHTML = `<span>${escapeHTML(mensaje)}</span>`;
  stack.appendChild(el);
  window.setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity 160ms ease'; window.setTimeout(() => el.remove(), 180); }, duracionMs);
}
const toast = {
  exito: (m) => mostrarToast(m, 'success'),
  error: (m) => mostrarToast(m, 'danger', 6000),
  info: (m) => mostrarToast(m, 'default'),
};

let modalActivo = null;
function abrirModal({ titulo, cuerpoHTML, acciones = [], anchoMax = '560px' }) {
  cerrarModalActivo();
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  const modal = document.createElement('div');
  modal.className = 'modal';
  modal.style.maxWidth = anchoMax;
  modal.setAttribute('role', 'dialog');
  modal.setAttribute('aria-modal', 'true');
  modal.innerHTML = `
    <div class="modal__header"><h3>${titulo}</h3><button class="btn btn--icon btn--ghost" data-cerrar aria-label="Cerrar">✕</button></div>
    <div class="modal__body">${cuerpoHTML}</div>
    ${acciones.length ? '<div class="modal__footer" data-acciones></div>' : ''}
  `;
  overlay.appendChild(modal);
  document.body.appendChild(overlay);
  document.body.style.overflow = 'hidden';
  const cerrar = () => { overlay.remove(); document.body.style.overflow = ''; document.removeEventListener('keydown', onKeydown); modalActivo = null; };
  const contenedorAcciones = modal.querySelector('[data-acciones]');
  acciones.forEach((accion) => {
    const btn = document.createElement('button');
    btn.className = `btn btn--${accion.variante || 'secondary'}`;
    btn.textContent = accion.texto;
    btn.addEventListener('click', () => accion.onClick(cerrar));
    contenedorAcciones?.appendChild(btn);
  });
  modal.querySelector('[data-cerrar]').addEventListener('click', cerrar);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) cerrar(); });
  function onKeydown(e) { if (e.key === 'Escape') cerrar(); }
  document.addEventListener('keydown', onKeydown);
  modal.querySelector('button, input, textarea, select')?.focus();
  modalActivo = cerrar;
  return cerrar;
}
function cerrarModalActivo() { if (modalActivo) modalActivo(); }
function confirmarAccion({ titulo, mensaje, textoConfirmar = 'Confirmar', onConfirmar }) {
  return abrirModal({
    titulo, cuerpoHTML: `<p>${mensaje}</p>`,
    acciones: [
      { texto: 'Cancelar', variante: 'secondary', onClick: (cerrar) => cerrar() },
      { texto: textoConfirmar, variante: 'danger', onClick: async (cerrar) => { await onConfirmar(); cerrar(); } },
    ],
  });
}

function crearTabla({ contenedor, columnas, porPagina = 10, onFilaClick, textoVacio = 'Sin resultados.' }) {
  let datos = []; let paginaActual = 1; let ordenColumna = null; let ordenAscendente = true;
  function setDatos(nuevosDatos) { datos = nuevosDatos || []; paginaActual = 1; pintar(); }
  function ordenarPor(clave) { if (ordenColumna === clave) ordenAscendente = !ordenAscendente; else { ordenColumna = clave; ordenAscendente = true; } pintar(); }
  function datosOrdenados() {
    if (!ordenColumna) return datos;
    return [...datos].sort((a, b) => {
      const va = a[ordenColumna]; const vb = b[ordenColumna];
      if (va == null) return 1; if (vb == null) return -1;
      const cmp = typeof va === 'number' ? va - vb : String(va).localeCompare(String(vb), 'es');
      return ordenAscendente ? cmp : -cmp;
    });
  }
  function pintar() {
    if (!datos.length) { contenedor.innerHTML = `<div class="empty-state"><h3>Sin datos</h3><p>${textoVacio}</p></div>`; return; }
    const ordenados = datosOrdenados();
    const totalPaginas = Math.max(1, Math.ceil(ordenados.length / porPagina));
    paginaActual = Math.min(paginaActual, totalPaginas);
    const inicio = (paginaActual - 1) * porPagina;
    const filasPagina = ordenados.slice(inicio, inicio + porPagina);
    contenedor.innerHTML = `
      <div class="table-wrap"><table class="table">
        <thead><tr>${columnas.map((col) => `<th ${col.ordenable ? `data-orden="${col.clave}" style="cursor:pointer;"` : ''}>${col.titulo} ${ordenColumna === col.clave ? (ordenAscendente ? '↑' : '↓') : ''}</th>`).join('')}</tr></thead>
        <tbody>${filasPagina.map((fila, i) => `<tr data-fila-index="${inicio + i}" ${onFilaClick ? 'style="cursor:pointer;"' : ''}>${columnas.map((col) => `<td>${col.render ? col.render(fila) : (fila[col.clave] ?? '—')}</td>`).join('')}</tr>`).join('')}</tbody>
      </table>
      <div class="pagination"><span class="text-sm text-secondary">${ordenados.length} registro(s) — página ${paginaActual} de ${totalPaginas}</span>
        <div class="flex gap-2"><button class="btn btn--secondary btn--sm" data-pag-prev ${paginaActual === 1 ? 'disabled' : ''}>Anterior</button><button class="btn btn--secondary btn--sm" data-pag-next ${paginaActual === totalPaginas ? 'disabled' : ''}>Siguiente</button></div>
      </div></div>`;
    contenedor.querySelectorAll('[data-orden]').forEach((th) => th.addEventListener('click', () => ordenarPor(th.dataset.orden)));
    if (onFilaClick) contenedor.querySelectorAll('[data-fila-index]').forEach((tr) => tr.addEventListener('click', () => onFilaClick(ordenados[Number(tr.dataset.filaIndex)])));
    contenedor.querySelector('[data-pag-prev]')?.addEventListener('click', () => { paginaActual--; pintar(); });
    contenedor.querySelector('[data-pag-next]')?.addEventListener('click', () => { paginaActual++; pintar(); });
  }
  return { setDatos, refrescar: pintar };
}

// COMPONENTES: dropzone
// --------------------------------------------------------------
function crearDropzone({ contenedor, bucketId, multiple = false, accept = '*', onArchivosValidos }) {
  contenedor.classList.add('dropzone');
  contenedor.innerHTML = `<input type="file" data-input-archivo class="sr-only" ${multiple ? 'multiple' : ''} accept="${accept}" /><p class="font-medium">Arrastra tus archivos aquí</p><p class="text-sm text-tertiary">o haz clic para seleccionar — ${multiple ? 'puedes subir varios' : 'un archivo'}</p>`;
  const input = contenedor.querySelector('[data-input-archivo]');
  contenedor.addEventListener('click', () => input.click());
  ['dragenter', 'dragover'].forEach((evento) => contenedor.addEventListener(evento, (e) => { e.preventDefault(); contenedor.classList.add('dropzone--active'); }));
  ['dragleave', 'drop'].forEach((evento) => contenedor.addEventListener(evento, (e) => { e.preventDefault(); contenedor.classList.remove('dropzone--active'); }));
  contenedor.addEventListener('drop', async (e) => { await procesar(Array.from(e.dataTransfer.files)); });
  input.addEventListener('change', async (e) => { await procesar(Array.from(e.target.files)); input.value = ''; });
  async function procesar(archivos) {
    if (!archivos.length) return;
    if (!multiple) archivos = archivos.slice(0, 1);
    const validos = [];
    for (const archivo of archivos) {
      const resultado = await validarArchivoCompleto(archivo, bucketId);
      if (!resultado.valido) { toast.error(`${archivo.name}: ${resultado.error}`); contenedor.classList.add('dropzone--error'); window.setTimeout(() => contenedor.classList.remove('dropzone--error'), 1500); continue; }
      validos.push(archivo);
    }
    if (validos.length) await onArchivosValidos(validos, { formatearTamanoArchivo });
  }
}

async function abrirVistaPrevia({ bucketId, ruta, nombreArchivo, mimeType }) {

    titulo: nombreArchivo, cuerpoHTML, anchoMax: esPDF ? '820px' : '640px',

      { texto: 'Cerrar', variante: 'secondary', onClick: (cerrar) => cerrar() },

}

/** Anillo de progreso SVG. Devuelve HTML string. */
function progressRing({ porcentaje = 0, tamano = 64, grosor = 6, id }) {
  const radio = (tamano - grosor) / 2;
  const circunferencia = 2 * Math.PI * radio;
  const offset = circunferencia * (1 - Math.min(Math.max(porcentaje, 0), 100) / 100);
  const ringId = id || `ring-${Math.random().toString(36).slice(2, 9)}`;
  return `
    <div class="progress-ring" style="width:${tamano}px;height:${tamano}px;" id="${ringId}">
      <svg width="${tamano}" height="${tamano}" viewBox="0 0 ${tamano} ${tamano}">
        <circle class="progress-ring__track" cx="${tamano / 2}" cy="${tamano / 2}" r="${radio}" stroke-width="${grosor}" />
        <circle class="progress-ring__value" cx="${tamano / 2}" cy="${tamano / 2}" r="${radio}" stroke-width="${grosor}"
          stroke-dasharray="${circunferencia}" stroke-dashoffset="${circunferencia}" data-offset-final="${offset}" />
      </svg>
      <span class="progress-ring__label">${Math.round(porcentaje)}%</span>
    </div>`;
}
/** Anima los rings ya insertados en el DOM (llamar después de insertar el HTML). */
function activarProgressRings(contenedor = document) {
  contenedor.querySelectorAll('.progress-ring__value').forEach((circle) => {
    const offsetFinal = circle.getAttribute('data-offset-final');
    requestAnimationFrame(() => { requestAnimationFrame(() => { circle.style.strokeDashoffset = offsetFinal; }); });
  });
}

/** Contador animado: cuenta desde 0 hasta el valor final. */
function animarContador(elemento, valorFinal, { duracionMs = 900, sufijo = '' } = {}) {
  const inicio = performance.now();
  const desde = 0;
  function tick(ahora) {
    const progreso = Math.min((ahora - inicio) / duracionMs, 1);
    const easeOut = 1 - Math.pow(1 - progreso, 3);
    const valorActual = Math.round(desde + (valorFinal - desde) * easeOut);
    elemento.textContent = `${valorActual}${sufijo}`;
    if (progreso < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

/** Mini gráfico de barras (sparkline simple) a partir de un arreglo de números. */
function miniBars(valores = []) {
  const max = Math.max(...valores, 1);
  return `<div class="mini-bars">${valores.map((v) => `<div class="mini-bars__bar" style="height:${Math.max((v / max) * 100, 4)}%;" title="${v}"></div>`).join('')}</div>`;
}

/** Busca en empresas/productos/pendientes según el rol. Máx. 5 por categoría. */
async function buscarGlobal(texto) {
  const q = texto.trim();
  if (q.length < 2) return { empresas: [], productos: [], pendientes: [] };

  const resultado = { empresas: [], productos: [], pendientes: [] };

  if (esStaff()) {
    const { data: empresas } = await supabase.from('empresas').select('id, razon_social').eq('activo', true).ilike('razon_social', `%${q}%`).limit(5);
    resultado.empresas = (empresas || []).map((e) => ({ titulo: e.razon_social, ruta: `#/admin/empresas?abrir=${e.id}` }));

    const { data: productos } = await supabase.from('productos').select('id, nombre, sku, empresa_id, empresas(razon_social)').eq('activo', true).or(`nombre.ilike.%${q}%,sku.ilike.%${q}%`).limit(5);
    resultado.productos = (productos || []).map((p) => ({ titulo: `${p.nombre} (${p.empresas?.razon_social || ''})`, ruta: `#/admin/productos?empresa=${p.empresa_id}` }));

    const { data: pendientes } = await supabase.from('pendientes').select('id, titulo, empresa_id, empresas(razon_social)').ilike('titulo', `%${q}%`).limit(5);
    resultado.pendientes = (pendientes || []).map((p) => ({ titulo: `${p.titulo} (${p.empresas?.razon_social || ''})`, ruta: `#/admin/pendientes?empresa=${p.empresa_id}` }));
  } else {
    const empresaId = getEmpresaActualId();
    if (!empresaId) return resultado;
    const { data: productos } = await supabase.from('productos').select('id, nombre, sku').eq('empresa_id', empresaId).eq('activo', true).or(`nombre.ilike.%${q}%,sku.ilike.%${q}%`).limit(5);
    resultado.productos = (productos || []).map((p) => ({ titulo: p.nombre, ruta: '#/proveedor/productos' }));

    const { data: pendientes } = await supabase.from('pendientes').select('id, titulo').eq('empresa_id', empresaId).ilike('titulo', `%${q}%`).limit(5);
    resultado.pendientes = (pendientes || []).map((p) => ({ titulo: p.titulo, ruta: '#/proveedor/pendientes' }));
  }
  return resultado;
}

/** Muestra/oculta y marca requerido un campo "especifica cuál" cuando el select vale 'OTRO'. */

    contenedor.classList.toggle('hidden', !esOtro);
    if (input) { if (esOtro) input.setAttribute('required', ''); else input.removeAttribute('required'); }
  }
  select.addEventListener('change', actualizar);
  actualizar();
}

// --------------------------------------------------------------
// READINESS POR PAÍS DESTINO — checklist de requisitos
// --------------------------------------------------------------
const REQUISITOS_PAIS = {
  usa: { nombre: 'Estados Unidos', bandera: '🇺🇸', requisitos: ['FDA', 'HACCP'] },
  canada: { nombre: 'Canadá', bandera: '🇨🇦', requisitos: ['CFIA', 'HACCP'] },
};

/** Calcula % de cumplimiento por país a partir de los documentos VIGENTES de la empresa. */
function calcularReadiness(documentos) {
  const vigentes = new Set((documentos || []).filter((d) => d.estado === 'vigente').map((d) => d.tipo));
  return Object.entries(REQUISITOS_PAIS).map(([clave, cfg]) => {
    const cumplidos = cfg.requisitos.filter((r) => vigentes.has(r));
    const faltantes = cfg.requisitos.filter((r) => !vigentes.has(r));
    return { clave, ...cfg, cumplidos, faltantes, porcentaje: Math.round((cumplidos.length / cfg.requisitos.length) * 100) };
  });
}

/** HTML para usar dentro del portal (usa variables CSS del sistema de diseño). */
function htmlReadinessPorPais(documentos) {
  return calcularReadiness(documentos).map((d) => `
    <div class="flex-col gap-2" style="padding: var(--space-3) 0; border-bottom: 1px solid var(--color-border);">
      <div class="flex justify-between items-center">
        <span class="font-medium text-sm">${d.bandera} ${d.nombre}</span>
        <span class="text-sm font-semibold">${d.porcentaje}%</span>
      </div>
      ${d.faltantes.length
        ? `<span class="text-xs text-tertiary">Falta: ${d.faltantes.map(formatearEtiqueta).join(', ')}</span>`
        : '<span class="text-xs" style="color:var(--color-success);">Todos los requisitos vigentes</span>'}
    </div>`).join('');
}

/** Versión en HTML plano (sin variables CSS) para el expediente imprimible. */
function htmlReadinessPlano(documentos) {
  return calcularReadiness(documentos).map((d) =>
    `<p><strong>${d.bandera} ${d.nombre}:</strong> ${d.porcentaje}% ${d.faltantes.length ? '— Falta: ' + d.faltantes.map(formatearEtiqueta).join(', ') : '— Todos los requisitos vigentes'}</p>`
  ).join('');
}

// --------------------------------------------------------------
// EXPEDIENTE DE CUMPLIMIENTO — vista imprimible (Guardar como PDF
// desde el diálogo de impresión del navegador; no requiere
// librerías adicionales).
// --------------------------------------------------------------
function generarExpediente({ empresa, documentos, productos }) {
  const ventana = window.open('', '_blank');
  if (!ventana) { toast.error('Tu navegador bloqueó la ventana emergente. Habilítala e intenta de nuevo.'); return; }

  const filasDocs = (documentos || []).map((d) => `<tr><td>${formatearTipoDocumento(d)}</td><td>${formatearEtiqueta(d.estado)}</td><td>${formatearFecha(d.fecha_vencimiento)}</td></tr>`).join('');
  const filasProd = (productos || []).map((p) => `<tr><td>${p.nombre}</td><td>${p.sku}</td><td>${formatearMoneda(p.precio, p.moneda)}</td></tr>`).join('');

  ventana.document.write(`
    <html><head><title>Expediente — ${empresa.razon_social}</title>
    <meta charset="UTF-8" />
    <style>
      body { font-family: Arial, Helvetica, sans-serif; padding: 48px; color: #10151F; max-width: 780px; margin: 0 auto; }
      h1 { font-size: 24px; margin-bottom: 4px; }
      h2 { font-size: 15px; margin-top: 28px; border-bottom: 2px solid #2A4A73; padding-bottom: 6px; color: #2A4A73; }
      table { width: 100%; border-collapse: collapse; margin-top: 8px; }
      td, th { padding: 7px 8px; border-bottom: 1px solid #E7E9EE; text-align: left; font-size: 13px; }
      th { background: #F0F2F5; }
      .meta { color: #5B6472; font-size: 13px; margin-bottom: 16px; }
      @media print { body { padding: 24px; } }
    </style></head><body>
    <h1>Expediente de Cumplimiento para Exportación</h1>
    <p class="meta">${empresa.razon_social}${empresa.nombre_comercial ? ' (' + empresa.nombre_comercial + ')' : ''} — generado el ${formatearFecha(new Date())}</p>
    <h2>Preparación por país destino</h2>
    ${htmlReadinessPlano(documentos)}
    <h2>Certificaciones y documentos</h2>
    <table><tr><th>Documento</th><th>Estado</th><th>Vence</th></tr>${filasDocs || '<tr><td colspan="3">Sin documentos cargados.</td></tr>'}</table>
    <h2>Catálogo de productos</h2>
    <table><tr><th>Producto</th><th>SKU</th><th>Precio</th></tr>${filasProd || '<tr><td colspan="3">Sin productos cargados.</td></tr>'}</table>
    <script>window.onload = () => window.print();<\/script>
    </body></html>`);
  ventana.document.close();
}

// ONBOARDING DEL PROVEEDOR — checklist de primeros pasos
// Pensado para completarse en menos de 10 minutos. Se oculta
// permanentemente cuando el proveedor marca "completado", o solo
// por esta sesión con el botón de cerrar (✕).
// --------------------------------------------------------------
function pintarOnboarding(contenedor, empresa, conteos) {
  if (!contenedor || empresa.onboarding_completado) { if (contenedor) contenedor.innerHTML = ''; return; }

  const pasos = [
    { texto: 'Confirma los datos de contacto de tu empresa', hecho: !!empresa.email_contacto, ruta: '#/proveedor/perfil' },
    { texto: 'Sube al menos una certificación (FDA, HACCP, etc.)', hecho: conteos.documentos > 0, ruta: '#/proveedor/certificaciones' },
    { texto: 'Agrega tu primer producto al catálogo', hecho: conteos.productos > 0, ruta: '#/proveedor/productos' },
    { texto: 'Revisa tus pendientes y escribe un comentario si tienes dudas', hecho: false, ruta: '#/proveedor/pendientes' },
  ];

  contenedor.innerHTML = `
    <div class="card" style="margin-bottom: var(--space-6); border-color: var(--color-accent);">
      <div class="card__body flex-col gap-4">
        <div class="flex justify-between items-start">
          <div><h3>👋 Primeros pasos</h3><p class="text-sm text-secondary">Te toma menos de 10 minutos dejar tu perfil listo para revisión.</p></div>
          <button class="btn btn--ghost btn--sm" id="btn-cerrar-onboarding" aria-label="Cerrar">✕</button>
        </div>
        <div class="flex-col gap-2">
          ${pasos.map((p) => `
            <a href="${p.ruta}" class="flex items-center gap-3 text-sm" style="text-decoration:none;">
              <span style="width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:${p.hecho ? 'var(--color-success-subtle)' : 'var(--color-bg-subtle)'};color:${p.hecho ? 'var(--color-success)' : 'var(--color-text-tertiary)'};font-size:12px;">${p.hecho ? '✓' : ''}</span>
              <span style="color:${p.hecho ? 'var(--color-text-tertiary)' : 'var(--color-text-primary)'};${p.hecho ? 'text-decoration:line-through;' : ''}">${escapeHTML(p.texto)}</span>
            </a>`).join('')}
        </div>
        <button class="btn btn--secondary btn--sm" id="btn-completar-onboarding" style="align-self:flex-start;">Marcar como completado</button>
      </div>
    </div>`;

  contenedor.querySelector('#btn-cerrar-onboarding').addEventListener('click', () => { contenedor.innerHTML = ''; });
  contenedor.querySelector('#btn-completar-onboarding').addEventListener('click', async () => {
    try {
      await actualizarEmpresa(empresa.id, { onboarding_completado: true });
      toast.exito('¡Listo! Bienvenido al portal.');
      contenedor.innerHTML = '';
    } catch (err) { toast.error(err.message); }
  });
}

// HISTORIAL DE VERSIONES DE DOCUMENTOS — modal reutilizable

async function abrirModalVersiones(documento, empresaId, onActualizado) {
  const versiones = await listarVersiones(documento.id);
  const cuerpoHTML = `
    <div class="flex-col gap-4">
      <div class="flex-col gap-2">
        <span class="font-medium text-sm">Versión actual: v${documento.version_actual || 1}</span>
        <div id="lista-versiones" class="flex-col gap-2"></div>
      </div>
      <div class="flex-col gap-2">
        <span class="font-medium text-sm">Subir nueva versión (reemplaza el archivo activo)</span>
        <div id="dropzone-version"></div>
      </div>
    </div>`;
  abrirModal({ titulo: `Versiones — ${documento.nombre_archivo}`, cuerpoHTML, anchoMax: '600px', acciones: [{ texto: 'Cerrar', variante: 'secondary', onClick: (cerrar) => cerrar() }] });

  function pintarVersiones() {
    const cont = document.getElementById('lista-versiones');
    if (!versiones.length) { cont.innerHTML = '<span class="text-xs text-tertiary">Esta es la primera versión, aún no hay historial.</span>'; return; }
    cont.innerHTML = versiones.map((v) => `
      <button class="btn btn--secondary btn--sm" data-ver-version="${v.ruta_storage}" data-mime="application/pdf" style="justify-content:space-between;">
        <span>v${v.numero_version} — ${escapeHTML(v.usuarios?.nombre_completo || '')}</span>
        <span class="text-tertiary">${formatearFechaHora(v.creado_en)}</span>
      </button>`).join('');
    cont.querySelectorAll('[data-ver-version]').forEach((btn) => btn.addEventListener('click', () => abrirVistaPrevia({ bucketId: BUCKETS.DOCUMENTOS, ruta: btn.dataset.verVersion, nombreArchivo: documento.nombre_archivo, mimeType: btn.dataset.mime })));
  }
  pintarVersiones();

  crearDropzone({
    contenedor: document.getElementById('dropzone-version'), bucketId: BUCKETS.DOCUMENTOS, multiple: false,
    onArchivosValidos: async ([archivo]) => {
      try {
        await subirNuevaVersion({ documentoId: documento.id, empresaId, archivo });
        toast.exito('Nueva versión subida correctamente.');
        cerrarModalActivo();
        await onActualizado?.();
      } catch (err) { toast.error(err.message); }
    },
  });
}

// --------------------------------------------------------------
// CALCULADOR DE COSTEO DE EXPORTACIÓN (landed cost)
// Cálculo en vivo, no persiste en base de datos — el usuario
// ingresa los supuestos cada vez (flete, arancel, margen deseado).
// --------------------------------------------------------------
function abrirCalculadoraCosteo(producto) {
  const cuerpoHTML = `
    <div class="flex-col gap-4">
      <p class="text-sm text-secondary">Precio FOB actual: <strong>${formatearMoneda(producto.precio, producto.moneda)}</strong> por ${escapeHTML(producto.presentacion || 'unidad')}.</p>
      <div class="grid gap-3" style="grid-template-columns: 1fr 1fr;">
        <div class="field"><label class="field__label">Flete estimado (por unidad)</label><input class="input" type="number" step="0.01" id="calc-flete" value="0" /></div>
        <div class="field"><label class="field__label">Arancel (%)</label><input class="input" type="number" step="0.1" id="calc-arancel" value="0" /></div>
      </div>
      <div class="field"><label class="field__label">Margen deseado sobre el landed cost (%)</label><input class="input" type="number" step="0.1" id="calc-margen" value="20" /></div>
      <div class="card" style="background: var(--color-bg-subtle); border:none;">
        <div class="card__body flex-col gap-2" id="calc-resultado"></div>
      </div>
    </div>`;

  const cerrarModal = abrirModal({ titulo: `Costeo de exportación — ${producto.nombre}`, cuerpoHTML, anchoMax: '520px', acciones: [{ texto: 'Cerrar', variante: 'secondary', onClick: (cerrar) => cerrar() }] });

  function recalcular() {
    const precioFOB = Number(producto.precio) || 0;
    const flete = Number(document.getElementById('calc-flete').value) || 0;
    const arancelPct = Number(document.getElementById('calc-arancel').value) || 0;
    const margenPct = Number(document.getElementById('calc-margen').value) || 0;

    const arancelMonto = precioFOB * (arancelPct / 100);
    const landedCost = precioFOB + flete + arancelMonto;
    const precioSugerido = landedCost * (1 + margenPct / 100);

    document.getElementById('calc-resultado').innerHTML = `
      <div class="flex justify-between text-sm"><span class="text-secondary">Precio FOB</span><span>${formatearMoneda(precioFOB, producto.moneda)}</span></div>
      <div class="flex justify-between text-sm"><span class="text-secondary">+ Flete</span><span>${formatearMoneda(flete, producto.moneda)}</span></div>
      <div class="flex justify-between text-sm"><span class="text-secondary">+ Arancel (${arancelPct}%)</span><span>${formatearMoneda(arancelMonto, producto.moneda)}</span></div>
      <div class="flex justify-between font-semibold" style="border-top:1px solid var(--color-border); padding-top:8px;"><span>Landed cost</span><span>${formatearMoneda(landedCost, producto.moneda)}</span></div>
      <div class="flex justify-between font-semibold" style="color:var(--color-primary);"><span>Precio sugerido de venta (+${margenPct}%)</span><span>${formatearMoneda(precioSugerido, producto.moneda)}</span></div>`;
  }
  ['calc-flete', 'calc-arancel', 'calc-margen'].forEach((id) => document.getElementById(id).addEventListener('input', recalcular));
  recalcular();
}

// --------------------------------------------------------------
// COMBO BUSCABLE — dropdown con búsqueda en vivo (para filtros
// con muchas opciones, ej. tipo de documento).
// --------------------------------------------------------------
function crearComboBuscable({ contenedor, opciones, placeholder = 'Buscar…', valorInicialTexto = '', onSeleccionar }) {
  contenedor.innerHTML = `
    <div style="position:relative;">
      <input class="input" type="text" placeholder="${escapeHTML(placeholder)}" data-combo-input autocomplete="off" value="${escapeHTML(valorInicialTexto)}" />
      <div class="notif-panel hidden" data-combo-panel style="width:100%; max-height:280px; overflow-y:auto;"></div>
    </div>`;
  const input = contenedor.querySelector('[data-combo-input]');
  const panel = contenedor.querySelector('[data-combo-panel]');

  function pintarOpciones(filtro = '') {
    const q = filtro.toLowerCase();
    const filtradas = opciones.filter((o) => o.texto.toLowerCase().includes(q));
    panel.innerHTML = filtradas.length
      ? filtradas.map((o) => `<a data-valor="${o.valor}" class="notif-item" style="cursor:pointer; display:block;">${escapeHTML(o.texto)}</a>`).join('')
      : '<div class="empty-state" style="padding:16px;"><p>Sin coincidencias.</p></div>';
    panel.querySelectorAll('[data-valor]').forEach((el) => {
      el.addEventListener('click', () => {
        const opcion = opciones.find((o) => o.valor === el.dataset.valor);
        input.value = opcion ? opcion.texto : '';
        panel.classList.add('hidden');
        onSeleccionar(el.dataset.valor);
      });
    });
  }

  input.addEventListener('focus', () => { pintarOpciones(input.value === valorInicialTexto ? '' : input.value); panel.classList.remove('hidden'); });
  input.addEventListener('input', () => pintarOpciones(input.value));
  document.addEventListener('click', (e) => { if (!contenedor.contains(e.target)) panel.classList.add('hidden'); });
}

/** Logo real de Susazón (imagen subida por el usuario, incrustada en base64). */
function imgLogoSusazon(anchoPx = 240) {
  return `<img src="data:image/png;base64,${LOGO_SUSAZON_B64}" alt="Susazón — Cadena de Valor" style="width:${anchoPx}px; height:auto; display:block;" />`;
}

/** Camión imponente — ilustración grande y con fuerza visual para el hero de autenticación. */
function camionImponente(anchoPx = 380) {
  return `
    <svg width="${anchoPx}" viewBox="0 0 560 240" xmlns="http://www.w3.org/2000/svg" style="display:block; max-width:100%;">
      <defs>
        <linearGradient id="trailerGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#3A3A3E"/>
          <stop offset="55%" stop-color="#232326"/>

async function registrarHistorial({ empresaId = null, accion, entidadTipo = null, entidadId = null, detalle = null }) {
  const usuario = getUsuarioActual();
  if (!usuario) return;
  const { error } = await supabase.from('historial_actividad').insert({ empresa_id: empresaId, usuario_id: usuario.id, accion, entidad_tipo: entidadTipo, entidad_id: entidadId, detalle });
  if (error) console.warn('[historial] No se pudo registrar la actividad:', error);
}
async function listarHistorial({ empresaId, limite = 50, accion } = {}) {
  let query = supabase.from('historial_actividad').select('*, usuarios(nombre_completo)').order('creado_en', { ascending: false }).limit(limite);
  if (empresaId) query = query.eq('empresa_id', empresaId);
  if (accion) query = query.eq('accion', accion);
  const { data, error } = await query;
  if (error) throw new Error(mensajeErrorSupabase(error));
  return data;
}

async function obtenerKPIsGenerales() {
  const [{ count: totalEmpresas }, { data: pendientesAbiertos }, { data: pendientesVencidos }, { data: documentosVencidos }] = await Promise.all([
    supabase.from('empresas').select('*', { count: 'exact', head: true }).eq('activo', true),
    supabase.from('pendientes').select('id').neq('estado', 'completado').neq('estado', 'cancelado'),
    supabase.from('pendientes').select('id').lt('fecha_limite', new Date().toISOString().slice(0, 10)).neq('estado', 'completado'),
    supabase.from('documentos').select('id').eq('estado', 'vencida'),
  ]);
  const { data: empresas } = await supabase.from('empresas').select('porcentaje_avance').eq('activo', true);
  const avancePromedio = empresas?.length ? Math.round(empresas.reduce((acc, e) => acc + Number(e.porcentaje_avance), 0) / empresas.length) : 0;
  return { totalEmpresas: totalEmpresas || 0, pendientesAbiertos: pendientesAbiertos?.length || 0, pendientesVencidos: pendientesVencidos?.length || 0, documentosVencidos: documentosVencidos?.length || 0, avancePromedio };
}

  const usuario = getUsuarioActual();

/** Sube una nueva versión de un documento existente, conservando el historial de versiones anteriores. */
async function subirNuevaVersion({ documentoId, empresaId, archivo, notaCambio }) {
  const usuario = getUsuarioActual();
  if (!usuario) throw new Error('Tu sesión expiró. Recarga la página e inicia sesión de nuevo.');
  const ruta = construirRutaStorage(empresaId, archivo.name);
  const { error: uploadError } = await supabase.storage.from(BUCKETS.DOCUMENTOS).upload(ruta, archivo);
  if (uploadError) throw new Error(mensajeErrorSupabase(uploadError));

  const { data: docActual, error: errDoc } = await supabase.from('documentos').select('version_actual').eq('id', documentoId).single();
  if (errDoc) throw new Error(mensajeErrorSupabase(errDoc));
  const nuevaVersion = (docActual.version_actual || 1) + 1;

  const { error: errVersion } = await supabase.from('documento_versiones').insert({
    documento_id: documentoId, numero_version: nuevaVersion, ruta_storage: ruta, tamano_bytes: archivo.size, subido_por: usuario.id, nota_cambio: notaCambio || null,
  });
  if (errVersion) throw new Error(mensajeErrorSupabase(errVersion));

  const { data, error } = await supabase.from('documentos').update({
    ruta_storage: ruta, nombre_archivo: archivo.name, mime_type: archivo.type, tamano_bytes: archivo.size, version_actual: nuevaVersion,
  }).eq('id', documentoId).select().single();
  if (error) throw new Error(mensajeErrorSupabase(error));

  await registrarHistorial({ empresaId, accion: 'documento_actualizado', entidadTipo: 'documento', entidadId: documentoId, detalle: { version: nuevaVersion } });
  return data;
}

  const ruta = construirRutaStorage(`${empresaId}/${pendienteId}`, archivo.name);
  const { error: uploadError } = await supabase.storage.from(BUCKETS.PENDIENTES).upload(ruta, archivo);
  if (uploadError) throw new Error(mensajeErrorSupabase(uploadError));
  const { data, error } = await supabase.from('pendiente_archivos').insert({ pendiente_id: pendienteId, nombre_archivo: archivo.name, ruta_storage: ruta, mime_type: archivo.type, tamano_bytes: archivo.size, subido_por: usuario.id }).select().single();
  if (error) throw new Error(mensajeErrorSupabase(error));
  return data;
}
async function listarArchivosPendiente(pendienteId) {
  const { data, error } = await supabase.from('pendiente_archivos').select('*').eq('pendiente_id', pendienteId).order('creado_en', { ascending: false });

async function listarComentarios({ empresaId, pendienteId }) {
  let query = supabase.from('comentarios').select('*, usuarios(nombre_completo, rol), comentario_adjuntos(*)').eq('empresa_id', empresaId).eq('eliminado', false).order('creado_en', { ascending: true });

// --------------------------------------------------------------
// REALTIME GENÉRICO — usado por las vistas de admin para reflejar
// en vivo lo que hacen los proveedores (subir documentos, crear
// productos/pendientes, etc.). Solo una suscripción activa a la
// vez; el router cancela la anterior en cada cambio de vista.
// --------------------------------------------------------------
let canalEnVivoActual = null;

/**
 * @param {{tabla:string, filtro?:string}[]} tablas  ej. [{tabla:'productos', filtro:'empresa_id=eq.X'}]
 * @param {() => void} callback  se ejecuta en cualquier INSERT/UPDATE/DELETE
 */
function suscribirseEnVivo(tablas, callback) {
  cancelarSuscripcionEnVivo();
  let canal = supabase.channel(`live-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`);
  tablas.forEach(({ tabla, filtro }) => {
    canal = canal.on('postgres_changes', { event: '*', schema: 'public', table: tabla, ...(filtro ? { filter: filtro } : {}) }, callback);
  });
  canal.subscribe();
  canalEnVivoActual = canal;
}

function cancelarSuscripcionEnVivo() {
  if (canalEnVivoActual) { supabase.removeChannel(canalEnVivoActual); canalEnVivoActual = null; }
}

function suscribirseAComentarios(empresaId, onNuevoComentario) {
  const canal = supabase.channel(`comentarios-empresa-${empresaId}`).on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'comentarios', filter: `empresa_id=eq.${empresaId}` }, (payload) => onNuevoComentario(payload.new)).subscribe();
  return () => supabase.removeChannel(canal);
}
async function crearComentario({ empresaId, pendienteId = null, contenido }) {
  const usuario = getUsuarioActual();
  if (!usuario) throw new Error('Tu sesión expiró. Recarga la página e inicia sesión de nuevo.');
  const texto = normalizarTexto(contenido);
  if (!texto) throw new Error('El comentario no puede estar vacío.');
  const { data, error } = await supabase.from('comentarios').insert({ empresa_id: empresaId, pendiente_id: pendienteId, usuario_id: usuario.id, contenido: texto }).select('*, usuarios(nombre_completo, rol)').single();
  if (error) throw new Error(mensajeErrorSupabase(error));
  await registrarHistorial({ empresaId, accion: 'comentario_agregado', entidadTipo: 'comentario', entidadId: data.id });
  return data;
}

function activarEventosTopbar(root) {
  root.querySelector('[data-toggle-sidebar]')?.addEventListener('click', alternarSidebar);
  root.querySelector('[data-toggle-tema]')?.addEventListener('click', alternarTema);
  root.querySelector('[data-logout]')?.addEventListener('click', cerrarSesion);
  const botonNotif = root.querySelector('[data-toggle-notif]');
  const panelNotif = root.querySelector('[data-panel-notif]');
  botonNotif?.addEventListener('click', async () => { const oculto = panelNotif.classList.contains('hidden'); if (oculto) await pintarNotificacionesPanel(panelNotif); panelNotif.classList.toggle('hidden'); });

  const inputBusqueda = root.querySelector('#input-busqueda-global');
  const panelBusqueda = root.querySelector('#panel-busqueda');
  let debounceBusqueda;
  inputBusqueda?.addEventListener('input', (e) => {
    window.clearTimeout(debounceBusqueda);
    const texto = e.target.value;
    debounceBusqueda = window.setTimeout(async () => {
      if (texto.trim().length < 2) { panelBusqueda.classList.add('hidden'); return; }
      const resultado = await buscarGlobal(texto);
      panelBusqueda.innerHTML = htmlResultadosBusqueda(resultado);
      panelBusqueda.classList.remove('hidden');
    }, 300);
  });

  document.addEventListener('click', (e) => {
    if (!root.contains(e.target)) { panelNotif?.classList.add('hidden'); panelBusqueda?.classList.add('hidden'); }
  });
}

    kpiCard({ etiqueta: 'Pendientes abiertos', valor: kpis.pendientesAbiertos }),
    kpiCard({ etiqueta: 'Pendientes vencidos', valor: kpis.pendientesVencidos, delta: kpis.pendientesVencidos > 0 ? { valor: 'Requiere atención', direccion: 'down' } : undefined }),
    kpiCard({ etiqueta: 'Documentos vencidos', valor: kpis.documentosVencidos, delta: kpis.documentosVencidos > 0 ? { valor: 'Revisar', direccion: 'down' } : undefined }),
  ].join('');
  document.querySelectorAll('#kpis-root .kpi-card__value').forEach((el) => {
    const valor = parseInt(el.textContent, 10);
    const sufijo = el.textContent.includes('%') ? '%' : '';
    if (!Number.isNaN(valor)) animarContador(el, valor, { sufijo });
  });

  const empresas = await listarEmpresas();
  const enProceso = empresas.filter((e) => etapaPorAvance(e.porcentaje_avance) === 'proceso').length;
  const yaCasi = empresas.filter((e) => etapaPorAvance(e.porcentaje_avance) === 'casi').length;
  const liberadas = empresas.filter((e) => etapaPorAvance(e.porcentaje_avance) === 'listo').length;
  document.getElementById('panel-avance').innerHTML = `
    ${progressRing({ porcentaje: kpis.avancePromedio, tamano: 96, grosor: 9 })}
    <div class="flex-col gap-3" style="flex:1;">

    </div>`;
  activarProgressRings(document.getElementById('panel-avance'));

  const actividad7d = await listarHistorial({ limite: 200 });
  const hoy = new Date();
  const conteosPorDia = Array.from({ length: 7 }).map((_, i) => {
    const dia = new Date(hoy); dia.setDate(hoy.getDate() - (6 - i));
    const clave = dia.toISOString().slice(0, 10);
    return actividad7d.filter((a) => a.creado_en?.slice(0, 10) === clave).length;
  });
  document.getElementById('panel-actividad-chart').innerHTML = `
    ${miniBars(conteosPorDia)}
    <div class="flex justify-between text-xs text-tertiary" style="margin-top: var(--space-2);">
      ${Array.from({ length: 7 }).map((_, i) => { const d = new Date(hoy); d.setDate(hoy.getDate() - (6 - i)); return `<span>${d.toLocaleDateString('es-MX', { weekday: 'short' })}</span>`; }).join('')}
    </div>`;

  const vencimientos = await listarCertificacionesPorVencer({ dias: 30 });
  crearTabla({
    contenedor: document.getElementById('tabla-vencimientos'),
    columnas: [
      { clave: 'empresa', titulo: 'Empresa', render: (f) => escapeHTML(f.empresas?.razon_social || '—') },

      { clave: 'estado', titulo: 'Estado', render: (f) => badgeSemaforo(f.estado) },
    ], porPagina: 8, textoVacio: 'No hay certificaciones por vencer en los próximos 30 días.',

  const actividad = await listarHistorial({ limite: 20 });
  document.getElementById('lista-actividad').innerHTML = actividad.length
    ? actividad.map((a) => `<div class="flex-col gap-1" style="padding-bottom: var(--space-3); border-bottom: 1px solid var(--color-border);"><span class="text-sm"><strong>${escapeHTML(a.usuarios?.nombre_completo || 'Sistema')}</strong> — ${escapeHTML(formatearEtiqueta(a.accion))}</span><span class="text-xs text-tertiary">${tiempoRelativo(a.creado_en)}</span></div>`).join('')
    : '<div class="empty-state"><p>Sin actividad reciente.</p></div>';

  suscribirseEnVivo([{ tabla: 'documentos' }, { tabla: 'pendientes' }, { tabla: 'empresas' }, { tabla: 'historial_actividad' }], () => vistaAdminDashboard());

/** Cambia la contraseña de cualquier usuario vía Edge Function (requiere service_role, nunca expuesta al navegador). */
function abrirModalCambiarPassword(usuarioId, nombreUsuario) {
  const cuerpoHTML = `
    <p class="text-sm text-secondary" style="margin-bottom: var(--space-4);">Vas a establecer una nueva contraseña para <strong>${escapeHTML(nombreUsuario)}</strong>. Compártesela de forma segura.</p>
    <form id="form-cambiar-password" class="flex-col gap-4">
      <div class="field"><label class="field__label">Nueva contraseña</label><input class="input" type="password" id="nueva-password" minlength="8" required /></div>
      <div class="field"><label class="field__label">Confirmar contraseña</label><input class="input" type="password" id="confirmar-password" minlength="8" required /></div>
    </form>`;
  abrirModal({
    titulo: 'Cambiar contraseña', cuerpoHTML,
    acciones: [
      { texto: 'Cancelar', variante: 'secondary', onClick: (cerrar) => cerrar() },
      { texto: 'Guardar nueva contraseña', variante: 'primary', onClick: async (cerrar) => {
        const p1 = document.getElementById('nueva-password').value;
        const p2 = document.getElementById('confirmar-password').value;
        if (p1.length < 8) return toast.error('La contraseña debe tener al menos 8 caracteres.');
        if (p1 !== p2) return toast.error('Las contraseñas no coinciden.');
        try {
          const { data: sesion } = await supabase.auth.getSession();
          const { data, error } = await supabase.functions.invoke('cambiar-password', {
            body: { usuarioId, nuevaPassword: p1 },
            headers: { Authorization: `Bearer ${sesion.session.access_token}` },
          });
          if (error || !data?.ok) throw new Error(data?.error || 'La función cambiar-password no respondió lo esperado. Revisa que el código desplegado en Supabase sea el correcto.');
          toast.exito('Contraseña actualizada correctamente.');
          cerrar();
        } catch (err) { toast.error(err.message || 'No se pudo cambiar la contraseña.'); }
      } },
    ],
  });
}

        { texto: 'Cancelar', variante: 'secondary', onClick: (cerrar) => cerrar() },
        { texto: 'Guardar cambios', variante: 'primary', onClick: async (cerrar) => {
          const datos = Object.fromEntries(new FormData(document.getElementById('form-editar-pendiente')).entries());
          if (!esRequerido(datos.titulo)) return toast.error('El título es obligatorio.');
          try {
            await actualizarPendiente(pendiente.id, selectEmpresa.value, { ...datos, responsable_id: datos.responsable_id || null, fecha_limite: datos.fecha_limite || null, porcentaje: datos.estado === 'completado' ? 100 : pendiente.porcentaje });
            toast.exito('Pendiente actualizado.'); cerrar(); await recargar();
          } catch (err) { toast.error(err.message); }
        } },
      ],
    });
  }
}

      { clave: 'tamano_bytes', titulo: 'Tamaño', render: (f) => formatearTamanoArchivo(f.tamano_bytes) },
      { clave: 'fecha_vencimiento', titulo: 'Vence', render: (f) => formatearFecha(f.fecha_vencimiento) },
      { clave: 'estado', titulo: 'Estado', render: (f) => badgeSemaforo(f.estado) },
      { clave: 'acciones', titulo: '', render: (f) => `<div class="flex gap-2">${f.version_actual > 1 ? '' : ''}<button class="btn btn--sm btn--secondary" data-versiones="${f.id}">Versiones</button>${esAdmin() ? `<button class="btn btn--sm btn--danger" data-eliminar="${f.id}">Eliminar</button>` : ''}</div>` },
    ], porPagina: 10, textoVacio: 'Esta empresa no tiene documentos cargados.',
  });

  let tipoFiltro = '';
  crearComboBuscable({
    contenedor: document.getElementById('combo-filtro-tipo'),
    placeholder: 'Filtrar por tipo de documento…',
    opciones: [{ valor: '', texto: 'Todos los tipos' }, ...TIPOS_DOCUMENTO_TODOS.map((t) => ({ valor: t, texto: formatearEtiqueta(t) }))],
    onSeleccionar: (valor) => { tipoFiltro = valor; recargar(); },
  });

  async function recargar() {
    const empresaId = selectEmpresa.value;
    if (!empresaId) return;
    documentosActuales = await listarDocumentosEmpresa(empresaId, tipoFiltro ? { tipo: tipoFiltro } : {});
    tabla.setDatos(documentosActuales);
    contenedor.querySelectorAll('[data-ver]').forEach((btn) => btn.addEventListener('click', () => { const doc = documentosActuales.find((d) => d.id === btn.dataset.ver); abrirVistaPrevia({ bucketId: BUCKETS.DOCUMENTOS, ruta: doc.ruta_storage, nombreArchivo: doc.nombre_archivo, mimeType: doc.mime_type }); }));
    contenedor.querySelectorAll('[data-eliminar]').forEach((btn) => btn.addEventListener('click', () => confirmarAccion({ titulo: 'Eliminar documento', mensaje: '¿Seguro que deseas eliminar este documento?', textoConfirmar: 'Eliminar', onConfirmar: async () => { await eliminarDocumento(btn.dataset.eliminar, empresaId); toast.exito('Documento eliminado.'); await recargar(); } })));
    contenedor.querySelectorAll('[data-versiones]').forEach((btn) => btn.addEventListener('click', () => { const doc = documentosActuales.find((d) => d.id === btn.dataset.versiones); abrirModalVersiones(doc, empresaId, recargar); }));
    suscribirseEnVivo([{ tabla: 'documentos', filtro: `empresa_id=eq.${empresaId}` }], () => recargar());
  }
  selectEmpresa.addEventListener('change', recargar);
  if (empresas.length) await recargar();

  if (esAdmin()) {
    wireSelectOtro('input-tipo', 'campo-otro-tipo', 'input-otro-tipo');
    crearDropzone({
      contenedor: document.getElementById('dropzone-root'), bucketId: BUCKETS.DOCUMENTOS, multiple: true, accept: '.pdf,.jpg,.jpeg,.png,.webp,.mp4,.mov,.doc,.docx,.xls,.xlsx',
      onArchivosValidos: async (archivos) => {
        const empresaId = selectEmpresa.value;
        if (!empresaId) return toast.error('Selecciona una empresa primero.');
        const tipo = document.getElementById('input-tipo').value;
        const fechaEmision = document.getElementById('input-emision').value;
        const fechaVencimiento = document.getElementById('input-vencimiento').value;
        const otroDescripcion = document.getElementById('input-otro-tipo').value.trim();
        if (tipo === 'OTRO' && !otroDescripcion) return toast.error('Especifica qué tipo de documento es.');
        for (const archivo of archivos) { try { await subirDocumento({ empresaId, archivo, tipo, fechaEmision, fechaVencimiento, otroDescripcion }); } catch (err) { toast.error(`${archivo.name}: ${err.message}`); } }
        toast.exito('Documento(s) subido(s) correctamente.'); await recargar();
      },
    });
  }
}

        const datosCrudos = Object.fromEntries(new FormData(document.getElementById('form-producto')).entries());

  const hilo = document.getElementById('hilo-comentarios');
  let cancelarSuscripcion = null;
  function pintarComentario(c) {
    const item = document.createElement('div');
    item.className = 'flex gap-3';
    item.innerHTML = `<div class="sello-exportacion" style="width:32px;height:32px;font-size:11px;flex-shrink:0;">${iniciales(c.usuarios?.nombre_completo)}</div>

    hilo.appendChild(item); hilo.scrollTop = hilo.scrollHeight;
  }
  async function recargar() {
    const empresaId = selectEmpresa.value;
    if (!empresaId) return;
    cancelarSuscripcion?.();
    hilo.innerHTML = '';
    const comentarios = await listarComentarios({ empresaId });
    if (!comentarios.length) hilo.innerHTML = '<div class="empty-state"><p>Aún no hay comentarios para esta empresa.</p></div>';

    cancelarSuscripcion = suscribirseAComentarios(empresaId, async () => { const actualizados = await listarComentarios({ empresaId }); hilo.innerHTML = ''; actualizados.forEach(pintarComentario); });
  }
  selectEmpresa.addEventListener('change', recargar);
  if (empresas.length) await recargar();

  document.getElementById('form-comentario').addEventListener('submit', async (e) => {
    e.preventDefault();
    const input = document.getElementById('input-comentario');
    const texto = input.value.trim();
    if (!texto) return;
    const empresaId = selectEmpresa.value;

    try { await crearComentario({ empresaId, contenido: texto }); input.value = ''; } catch (err) { toast.error(err.message); }
  });
}

  const TIPOS_NO_CERTIFICACION = ['CATALOGO_PDF', 'LISTA_PRECIOS', 'FICHA_TECNICA', 'ESPECIFICACIONES', 'ETIQUETAS', 'FOTOGRAFIA', 'VIDEO', 'OTRO'];
  const empresaId = getEmpresaActualId();
